<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZEFIX — Vaud Leads</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1e1e2e;
      --accent: #7fff6e;
      --accent2: #3dffd0;
      --text: #e8e8f0;
      --muted: #555570;
      --danger: #ff4f4f;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 80px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(127,255,110,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(127,255,110,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
    }

    .header { margin-bottom: 48px; }

    .tag {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 12px;
      opacity: 0.8;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(32px, 7vw, 56px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    h1 span { color: var(--accent); }

    .sub {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .row { display: flex; gap: 12px; flex-wrap: wrap; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 140px;
    }

    label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    select, input[type="number"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 2px;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }

    select:focus, input:focus { border-color: var(--accent); }

    .btn {
      width: 100%;
      padding: 16px;
      background: var(--accent);
      color: #0a0a0f;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.05em;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .log {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 20px;
      margin-top: 20px;
      font-size: 12px;
      line-height: 1.8;
      min-height: 60px;
      display: none;
    }

    .log.visible { display: block; }
    .log-line { display: flex; gap: 10px; }
    .log-line .ts { color: var(--muted); flex-shrink: 0; }
    .log-line .ok { color: var(--accent); }
    .log-line .err { color: var(--danger); }
    .log-line .info { color: var(--accent2); }

    .progress-wrap {
      height: 2px;
      background: var(--border);
      border-radius: 1px;
      margin-top: 16px;
      overflow: hidden;
      display: none;
    }
    .progress-wrap.visible { display: block; }
    .progress-bar {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(10,10,15,0.3);
      border-top-color: #0a0a0f;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="tag">// Lead Generator</div>
      <h1>ZEFIX<br/><span>Leads</span></h1>
      <p class="sub">Génère un .xlsx avec les dernières entreprises enregistrées<br/>en Suisse — prêt à prospecter.</p>
    </div>

    <div class="card">
      <div class="card-title">// Config</div>
      <div class="row">
        <div class="field">
          <label>Canton</label>
          <select id="canton">
            <option value="VD" selected>Vaud (VD)</option>
            <option value="GE">Genève (GE)</option>
            <option value="FR">Fribourg (FR)</option>
            <option value="VS">Valais (VS)</option>
            <option value="NE">Neuchâtel (NE)</option>
            <option value="ZH">Zürich (ZH)</option>
            <option value="BE">Berne (BE)</option>
          </select>
        </div>
        <div class="field">
          <label>Nombre</label>
          <input type="number" id="count" value="100" min="10" max="200" />
        </div>
      </div>
    </div>

    <button class="btn" id="btn" onclick="run()">
      <span class="spinner" id="spinner"></span>
      <span id="btn-label">Générer le .xlsx</span>
    </button>

    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="log" id="log"></div>
  </div>

  <script>
    function ts() {
      return new Date().toLocaleTimeString('fr-CH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function log(msg, type = 'info') {
      const el = document.getElementById('log');
      el.classList.add('visible');
      const line = document.createElement('div');
      line.className = 'log-line';
      line.innerHTML = `<span class="ts">${ts()}</span><span class="${type}">${msg}</span>`;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
    }

    function setProgress(pct) {
      document.getElementById('progress-wrap').classList.add('visible');
      document.getElementById('progress-bar').style.width = pct + '%';
    }

    async function fetchCompanies(canton, count) {
      const res = await fetch('/api/zefix', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ canton, count })
      });
      if (!res.ok) throw new Error(`API error ${res.status}`);
      const data = await res.json();
      console.log('ZEFIX raw response:', data);
      if (data.debug) console.log('ZEFIX debug:', data.debug);
      return data.list || data.firms || (Array.isArray(data) ? data : []);
    }

    function legalFormLabel(lf) {
      if (!lf) return '';
      return lf.shortName?.fr || lf.shortName?.de
          || lf.name?.fr || lf.name?.de
          || lf.nameFr || lf.nameDe || '';
    }

    function buildXlsx(companies, canton) {
      const headers = ['#', 'Raison sociale', 'Type', 'Localité', 'Canton', 'UID', 'Date SOGC', 'Téléphone', 'Email', 'Notes'];
      const rows = companies.map((c, i) => [
        i + 1,
        c.name || '',
        legalFormLabel(c.legalForm),
        c.legalSeat || '',
        c.canton || '',
        c.uid || '',
        c.sogcDate || '',
        '', '', ''
      ]);

      const aoa = [headers, ...rows];
      const ws = XLSX.utils.aoa_to_sheet(aoa);

      ws['!cols'] = [
        { wch: 4 },   // #
        { wch: 45 },  // Raison sociale
        { wch: 18 },  // Type
        { wch: 22 },  // Localité
        { wch: 8 },   // Canton
        { wch: 18 },  // UID
        { wch: 12 },  // Date SOGC
        { wch: 16 },  // Téléphone
        { wch: 28 },  // Email
        { wch: 24 }   // Notes
      ];
      ws['!freeze'] = { xSplit: 0, ySplit: 1 };
      ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { c: 0, r: 0 }, e: { c: headers.length - 1, r: rows.length } }) };

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, `ZEFIX ${canton}`);
      return wb;
    }

    async function run() {
      const btn = document.getElementById('btn');
      const spinner = document.getElementById('spinner');
      const label = document.getElementById('btn-label');
      const logEl = document.getElementById('log');

      logEl.innerHTML = '';
      logEl.classList.remove('visible');
      setProgress(0);

      btn.disabled = true;
      spinner.style.display = 'block';
      label.textContent = 'Connexion à ZEFIX...';

      const canton = document.getElementById('canton').value;
      const count = parseInt(document.getElementById('count').value) || 100;

      try {
        log(`Requête ZEFIX · canton=${canton} · max=${count}`, 'info');
        setProgress(10);

        const companies = await fetchCompanies(canton, count);
        setProgress(50);
        log(`${companies.length} entreprises reçues`, companies.length ? 'ok' : 'err');

        if (companies.length === 0) {
          log(`Vérifie la console (ZEFIX debug:) pour les détails`, 'err');
          label.textContent = 'Réessayer';
          return;
        }

        label.textContent = 'Génération du .xlsx...';
        setProgress(65);

        const wb = buildXlsx(companies, canton);
        setProgress(85);

        const filename = `zefix_${canton.toLowerCase()}_${new Date().toISOString().slice(0,10)}.xlsx`;
        XLSX.writeFile(wb, filename);
        setProgress(100);

        log(`Fichier téléchargé ✓`, 'ok');
        label.textContent = 'Générer le .xlsx';

      } catch (e) {
        log(`Erreur: ${e.message}`, 'err');
        label.textContent = 'Réessayer';
      } finally {
        btn.disabled = false;
        spinner.style.display = 'none';
      }
    }
  </script>
</body>
</html>
